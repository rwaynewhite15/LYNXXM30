<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XM30 — model inspector</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#128737;</text></svg>" />
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/": "./vendor/three/" } }
</script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #cfe6d6; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; top: 12px; left: 12px; background: rgba(6,14,10,.72);
        border: 1px solid rgba(125,253,166,.28); padding: 10px 12px; max-width: 330px;
        backdrop-filter: blur(4px); }
  #ui h1 { margin: 0 0 6px; font-size: 13px; letter-spacing: .16em; color: #7dfda6; }
  #ui p  { margin: 0 0 8px; opacity: .6; font-size: 11px; }
  #ui .m { display: flex; justify-content: space-between; gap: 12px; }
  #ui .m span { opacity: .6; }
  #ui hr { border: 0; border-top: 1px solid rgba(125,253,166,.2); margin: 8px 0; }
  #ui label { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  #ui input[type=range] { flex: 1; }
  #ui kbd { border: 1px solid rgba(125,253,166,.3); padding: 0 4px; }
  #views { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  #views button { background: rgba(125,253,166,.08); color: #cfe6d6; font: inherit;
    border: 1px solid rgba(125,253,166,.26); padding: 3px 8px; cursor: pointer; }
  #views button:hover { background: rgba(125,253,166,.18); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>XM30 MODEL INSPECTOR</h1>
  <p>Drag to orbit · wheel to zoom</p>
  <div class="m"><span>length</span><b id="m-len">–</b></div>
  <div class="m"><span>width</span><b id="m-wid">–</b></div>
  <div class="m"><span>height</span><b id="m-hgt">–</b></div>
  <div class="m"><span>triangles</span><b id="m-tri">–</b></div>
  <hr />
  <label>AZ <input id="s-az" type="range" min="-180" max="180" value="0" step="1" /><b id="v-az">0°</b></label>
  <label>EL <input id="s-el" type="range" min="-10" max="45" value="0" step="1" /><b id="v-el">0°</b></label>
  <label>CDR<input id="s-cdr" type="range" min="-180" max="180" value="0" step="1" /><b id="v-cdr">0°</b></label>
  <div id="views">
    <button data-v="iso">iso</button>
    <button data-v="side">side</button>
    <button data-v="front">front</button>
    <button data-v="rear">rear</button>
    <button data-v="top">top</button>
    <button data-v="detail">turret</button>
  </div>
</div>
<script type="module" src="./src/inspect.js"></script>
</body>
</html>
